[package]
name = "glichen-app"
description = "The glichen wallet as an app: glichen-gui's page and wallet in Tauri, for the desktop and Android"
version = "0.5.4"
edition = "2021"
license = "MIT"

[lib]
name = "glichen_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
glichen-gui = { path = "..", default-features = false }

# the camera, to scan an address's QR code (Android and iOS only)
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.5.3"
